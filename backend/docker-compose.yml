services:
  api:
    build: .
    image: recon-tool:latest
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    entrypoint: ["python3", "-m", "uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  recon:
    build: .
    image: recon-tool:latest
    volumes:
      - ./:/app
    working_dir: /app
    command: ["example.com"]
